kind = "web"
previewPath = "/"
title = "Gemini Studio Automation"
version = "1.0.0"
id = "artifacts/gemini-studio"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25667

[services.development]
run = "pnpm --filter @workspace/gemini-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gemini-studio", "run", "build" ]
publicDir = "artifacts/gemini-studio/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25667"
BASE_PATH = "/"
